<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='system-ui' font-size='18' font-weight='700' fill='white'%3E%E2%82%BA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>FinancialOS</title>
    <!-- Tema tercihi flash'ini onlemek icin: HTML ilk yuklendiginde
         localStorage'tan tema okuyup hemen <html>'e class ekliyoruz.
         Aksi halde React mount olana kadar yanlis tema gozukur. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('financialos-theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default: koyu tema
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
