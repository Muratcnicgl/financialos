# FinancialOS nginx — MA1 (Wave-8) base: SPA statik + /api reverse-proxy.
# MA2: bu dosyaya 443/TLS server bloğu + Let's Encrypt + HTTP→HTTPS redirect + HSTS/CSP eklenecek.
server {
    listen 80;
    server_name _;

    # gövde boyutu (finansal payload küçük; upload yok) — güvenlik: aşırı-büyük istek reddi
    client_max_body_size 1m;

    # gzip (metin/JSON)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # API → backend (aynı origin; CORS gerekmez). "backend" = compose servis adı.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA statik + client-side routing fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Temel güvenlik başlıkları (HSTS MA2'de HTTPS ile eklenir)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;
}
