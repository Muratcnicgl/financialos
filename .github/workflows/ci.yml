name: CI

# M69 (Wave-5): backend testleri + kullanım-döngüsü e2e her push/PR'da koşar.
# Gerekçe (tam-proje-durum-raporu §B24): UI→DB→rules_engine döngüsü 74 gün hiç işletilmedi;
# bu boşluk bir daha sessiz kalmasın diye e2e CI'a bağlandı.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # BUG #260 (SEC-020): bağımlılık açıkları KODU DEĞİŞMEDEN ortaya çıkar. P2 turunda
  # pip-audit ELLE koşulup 23 açık 0'a indirilmişti; tekrarlayan bir tarama olmadığı için
  # o "0" yazıldığı gün doğruydu, ertesi gün ölçülmüyordu. Haftalık koşum bu boşluğu kapatır.
  schedule:
    - cron: '0 6 * * 1'   # her pazartesi 06:00 UTC

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # BUG #238 (denetim D22): postgres servisi YOKTU → dual-dialect kapıları (RLS, Numeric
    # bit-bütünlüğü, NULL-ordering, geri-yükleme provası) her koşumda SKIP'e düşüyordu.
    # Prod dialect'i PostgreSQL (ADR-038); RLS policy'si sessizce düşse hiçbir test kırmızı
    # olmuyordu. Artık aynı iş hem SQLite hem Postgres kapılarıyla koşar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fresh DB migration lock (ADR-013a)
        run: python scripts/test_fresh_db_migration.py
      - name: Pytest (SQLite + PostgreSQL dual-dialect kapıları)
        env:
          SECRET_KEY: ci-test-secret-key-min-32-characters-long-0123456789
          # tests/pg_gate.py bunu görünce SKIP etmez. Tüm süit koşulur: dosya listesi
          # tutulmaz → yeni bir dual-dialect testi otomatik kapsanır (drift yok).
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/ -q

  # BUG #260 (SEC-020/SEC-021): bağımlılık güvenlik taraması CI'da YOKTU.
  # Ölçüm: `grep -rl "pip-audit" .github/` → 0 sonuç; backlog "tarama yok" diyordu ve
  # haklıydı — P2'deki 23→0 sonucu tek seferlik bir insan koşumuydu (L28: bir kez yeşil,
  # sürekli yeşil demek değildir). Bu iş her push + her pazartesi koşar.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: pip-audit (Python bağımlılıkları)
        run: |
          python -m pip install --upgrade pip pip-audit
          # requirements.txt sabit sürümlüdür; kurulum yapmadan dosyayı denetler.
          pip-audit -r requirements.txt --strict
      - name: npm audit (frontend, yüksek/kritik)
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate fresh DB
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
      - name: Start backend (AUTH on, rate-limit relaxed for e2e)
        env:
          DATABASE_URL: sqlite:///./data/ci.db
          SECRET_KEY: ci-test-secret-key-min-32-characters-long-0123456789
          AUTH_ENABLED: 'true'
          RATE_LIMIT_REGISTER_MAX: '1000'
          RATE_LIMIT_LOGIN_MAX: '1000'
        run: |
          python -m uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 && break; sleep 1; done
      - name: E2E (kullanım döngüsü + panel smoke)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
