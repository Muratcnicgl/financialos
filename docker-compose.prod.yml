# FinancialOS — PRODUCTION compose (MA1, Wave-8). Canlı deploy (Blok B) bunu kullanır.
# Kullanım: cp .env.prod.example .env.prod (gerçek secret'larla doldur — .gitignore'da) →
#           docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Mimari: db (postgres) + backend (gunicorn web, scheduler KAPALI) + scheduler (ayrı, scheduler AÇIK) + nginx (SPA+proxy).
# Scheduler ayrı servis → çok-worker'lı web'de cron çift-tetiklenmez; tek scheduler 7/24 fiyat/batch (MA4).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financialos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.prod'da zorunlu}
      POSTGRES_DB: financialos
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financialos -d financialos"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port DIŞARI AÇILMAZ (yalnız iç ağ) — güvenlik
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # BUG #230 (D11): `--env-file` YALNIZ compose'daki ${...} interpolasyonunu besler —
    # konteyner ortamına değişken YAZMAZ. Bu satır olmadan .env.prod'daki SUPPORT_EMAIL
    # (BUG #210: production'da zorunlu), SMTP_*, OAUTH_*, REGISTRATION_MODE konteynere hiç
    # ulaşmıyordu: backend startup'ta fail-fast ile düşüyor, deploy.sh healthcheck'i geçemiyor,
    # otomatik rollback aynı derecede bozuk önceki sürüme dönüyordu.
    # Aşağıdaki `environment` blogu env_file'ı EZER — hesaplanmış/sabit değerler orada kalır.
    env_file:
      - .env.prod
    environment:
      SERVICE_MODE: web
      ENVIRONMENT: production
      # BUG #169: konteyner varsayılanı UTC → date.today() TR'de 00:00-03:00 arası bir ÖNCEKİ
      # günü verir (günlük limit, işlem tarihi, ay sınırı tetikleme yanlış olur).
      TZ: ${TZ:-Europe/Istanbul}
      # BUG #182: nginx onde -> X-Forwarded-For'un EN SAGDAKI degeri gercek istemcidir.
      # Bu olmadan tum kullanicilar TEK rate-limit kovasina dusuyordu (login DoS).
      TRUST_PROXY_HEADERS: "1"
      AUTH_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env.prod'da zorunlu (fail-fast)}
      # BUG #238 (D22): burada `financialos` yazıyordu ve yorumu "NON-superuser" diyordu —
      # ama `financialos` bu dosyanın POSTGRES_USER'ı, yani postgres imajının BOOTSTRAP
      # SUPERUSER'ı. Superuser FORCE ROW LEVEL SECURITY'ye RAĞMEN RLS'i bypass eder →
      # ADR-038/M51'in "DB-katmanı 2. savunma" beyanı prod'da FİİLEN YOKTU.
      # Artık uygulama trafiği ayrı bir NOSUPERUSER/NOBYPASSRLS rolüyle akar; rol her
      # deploy'da entrypoint tarafından provizyon edilir (scripts/provision_app_role.py).
      DATABASE_URL: postgresql://${APP_DB_ROLE:-fos_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD .env.prod'da zorunlu (app rolü şifresi)}@db:5432/financialos
      # Şema değişikliği yalnız SAHİP rolüyle (app rolünün DDL yetkisi yok). Bu URL sadece
      # `alembic upgrade head` + rol provizyonu adımlarında kullanılır, sunucuda değil.
      MIGRATION_DATABASE_URL: postgresql://financialos:${POSTGRES_PASSWORD}@db:5432/financialos
      APP_DB_ROLE: ${APP_DB_ROLE:-fos_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # P9 (BUG #200): calisan surumun kimligi. deploy.sh git SHA'yi buraya gecirir ->
      # /api/health "version + build" doner; hata bildiriminde hangi kod kostugu KESIN.
      BUILD_COMMIT: ${BUILD_COMMIT:-}
      # P5 (BUG #201) kapasite: havuz PROCESS BASINA. Toplam = WEB_CONCURRENCY x (pool+overflow).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-fallback}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - "8000"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        # backend migrate + app rolünü provizyon ettikten sonra. Yarış olursa (rol henüz yok)
      # scheduler açılamaz ve `restart: unless-stopped` ile kendini toparlar (BUG #238).
      condition: service_started
    env_file:
      - .env.prod                    # BUG #230 (D11) — backend ile aynı gerekçe
    environment:
      SERVICE_MODE: scheduler
      ENVIRONMENT: production
      # BUG #169: cron saatleri (02:45 fiyat, 03:00 gece batch) YEREL saate göre planlanmış —
      # TZ olmadan UTC'de koşar, TR'de 05:45/06:00'a kayar.
      TZ: ${TZ:-Europe/Istanbul}
      # BUG #230 (D12): burada YOKTU. Scheduler de backend ile AYNI lifespan'i koşar
      # (docker-entrypoint.sh → uvicorn app.main:app) → production fail-fast tetikleniyor,
      # servis crash-loop'a giriyor ve 02:45 fiyat / 03:00 gece batch'i HİÇ koşmuyordu:
      # kullanıcı bayat fiyatlarla hesaplanmış net değere göre para kararı veriyordu.
      # deploy.sh bunu yalnız "UYARI" basıp çıkış kodu 0 ile geçiyordu (sessiz arıza).
      AUTH_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY zorunlu}
      # BUG #238 (D22): scheduler de uygulama trafiğidir → RLS'e tabi app rolü. Migration
      # koşmaz (entrypoint scheduler modu) → MIGRATION_DATABASE_URL burada BİLEREK yok.
      DATABASE_URL: postgresql://${APP_DB_ROLE:-fos_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD .env.prod'da zorunlu}@db:5432/financialos
      LLM_PROVIDER: ${LLM_PROVIDER:-fallback}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # MA2: nginx template ${DOMAIN}'i buradan doldurur (envsubst). IP-only deploy'da DOMAIN=IP olur.
      DOMAIN: ${DOMAIN:?DOMAIN .env.prod'da zorunlu (nginx server_name + TLS cert)}
    ports:
      - "80:80"
      - "443:443"     # MA2: HTTPS
    volumes:
      # Let's Encrypt sertifikaları (certbot yazar, nginx okur) + ACME webroot doğrulama
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot

  # MA2: Let's Encrypt certbot — canlı sertifika Blok B'de alınır/yenilenir (deploy/init-letsencrypt.sh).
  # Yenileme: 12 saatte bir dener (Let's Encrypt 90 gün, ~60. günde yeniler).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # BUG #230 (D13/D09): OTOMATİK YEDEK. Beta kullanıcılarının tüm finansal geçmişi tek bir
  # volume'da, tek bir Free-Tier VM'de duruyor ve hiçbir otomatik kopyası YOKTU. Depodaki tek
  # yedek otomasyonu (deploy/financialos-backup.service) SQLite-only script çağırdığı için
  # Postgres kurulumda her gece çıkış kodu 1 ile sessizce ölüyordu.
  # Yedekler adlandırılmış `pg-backups` hacminde (konteyner katmanında değil) → `down` ile
  # yok olmaz. Script yedeği DOĞRULAR (boyut + gzip bütünlüğü) ve rotasyon uygular.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      PGHOST: db
      # BUG #238: yedek BİLEREK şema sahibi rolüyle alınır. App rolü RLS'e tabidir; bir
      # workspace bağlamı sızarsa pg_dump EKSİK satırla "başarılı" biter — sessiz veri kaybı.
      PGUSER: financialos
      PGDATABASE: financialos
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.prod'da zorunlu}
      BACKUP_DIR: /backups
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # İlk yedek servis açılır açılmaz alınır; sonra 24 saatte bir.
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
    volumes:
      - pg-backups:/backups
      - ./deploy/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do sh /usr/local/bin/pg_backup.sh || echo "[yedek] BASARISIZ — bir sonraki denemeye kadar YEDEK YOK"; sleep "$${BACKUP_INTERVAL}" & wait $${!}; done'

volumes:
  pg-data:
  pg-backups:     # BUG #230: yedekler kalıcı hacimde (konteyner katmanında değil)
  letsencrypt:
  certbot-webroot:
