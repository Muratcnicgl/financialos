name: CI

# M69 (Wave-5): backend testleri + kullanım-döngüsü e2e her push/PR'da koşar.
# Gerekçe (tam-proje-durum-raporu §B24): UI→DB→rules_engine döngüsü 74 gün hiç işletilmedi;
# bu boşluk bir daha sessiz kalmasın diye e2e CI'a bağlandı.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # BUG #260 (SEC-020): bağımlılık açıkları KODU DEĞİŞMEDEN ortaya çıkar. P2 turunda
  # pip-audit ELLE koşulup 23 açık 0'a indirilmişti; tekrarlayan bir tarama olmadığı için
  # o "0" yazıldığı gün doğruydu, ertesi gün ölçülmüyordu. Haftalık koşum bu boşluğu kapatır.
  schedule:
    - cron: '0 6 * * 1'   # her pazartesi 06:00 UTC

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # BUG #238 (denetim D22): postgres servisi YOKTU → dual-dialect kapıları (RLS, Numeric
    # bit-bütünlüğü, NULL-ordering, geri-yükleme provası) her koşumda SKIP'e düşüyordu.
    # Prod dialect'i PostgreSQL (ADR-038); RLS policy'si sessizce düşse hiçbir test kırmızı
    # olmuyordu. Artık aynı iş hem SQLite hem Postgres kapılarıyla koşar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          # BUG #295 ikinci tur: 5432'yi HOST tarafında kullanmak yetmedi — runner imajının
          # KENDİ PostgreSQL'i o portta dinliyor (farklı şifreyle), yani testler yanlış
          # sunucuya bağlanmaya devam etti ("password authentication failed"). Adres
          # düzeltmek (localhost → 127.0.0.1) çakışmayı çözmez; PORTU ayırmak çözer.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fresh DB migration lock (ADR-013a)
        run: python scripts/test_fresh_db_migration.py
      - name: Pytest (SQLite + PostgreSQL dual-dialect kapıları)
        env:
          SECRET_KEY: ci-test-secret-key-min-32-characters-long-0123456789
          # tests/pg_gate.py bunu görünce SKIP etmez. Tüm süit koşulur: dosya listesi
          # tutulmaz → yeni bir dual-dialect testi otomatik kapsanır (drift yok).
          #
          # BUG #295: adres `localhost`tu ve runner'da `localhost` önce **::1 (IPv6)**
          # çözülüyor. Servis konteynerinin port eşlemesi IPv4'tedir; ::1'de ise runner
          # imajının KENDİ PostgreSQL'i dinliyor ve şifresi farklı →
          # "FATAL: password authentication failed for user postgres". Yani testler yanlış
          # veritabanına bağlanıyordu. 127.0.0.1 bunu tekilleştirir.
          PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
        run: python -m pytest tests/ -q

  # BUG #260 (SEC-020/SEC-021): bağımlılık güvenlik taraması CI'da YOKTU.
  # Ölçüm: `grep -rl "pip-audit" .github/` → 0 sonuç; backlog "tarama yok" diyordu ve
  # haklıydı — P2'deki 23→0 sonucu tek seferlik bir insan koşumuydu (L28: bir kez yeşil,
  # sürekli yeşil demek değildir). Bu iş her push + her pazartesi koşar.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: pip-audit (Python bağımlılıkları)
        run: |
          python -m pip install --upgrade pip pip-audit
          # requirements.txt sabit sürümlüdür; kurulum yapmadan dosyayı denetler.
          pip-audit -r requirements.txt --strict
      # BUG #298: tek bir `npm audit --audit-level=high` iki farklı soruyu birbirine
      # karıştırıyordu. ÜRETİM bağımlılığındaki bir açık kullanıcıya ulaşan koddadır —
      # yayını durdurmalıdır. GELİŞTİRME aracındaki açık (vite/esbuild dev-server) bundle'a
      # girmez; kullanıcıya ulaşmaz. İkisi tek eşikte toplanınca, bir dev aracının major
      # sürüm gerektiren açığı BÜTÜN CI'ı kırmızıya çeviriyor ve o kırmızı normalleşince
      # gerçek bir üretim açığı da fark edilmiyordu (son 30 koşum kırmızıydı).
      # Ayrım: üretim tarafı KIRMIZI yapar, geliştirme tarafı RAPORLANIR ama durdurmaz.
      - name: npm audit — ÜRETİM bağımlılıkları (yüksek/kritik → kırmızı)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — geliştirme bağımlılıkları (bilgi; kırmızı yapmaz)
        working-directory: frontend
        continue-on-error: true
        run: |
          echo "::group::Geliştirme bağımlılıkları (bundle'a girmez)"
          npm audit --audit-level=high || true
          echo "::endgroup::"
          echo "Not: buradaki bulgular kullanıcıya ulaşan kodu etkilemez; sürüm"
          echo "yükseltmeleri ayrı iş olarak planlanır (vite 5 -> 8 major)."
      # BUG #261 (SEC-018): sızmış anahtar taraması. `.gitignore` doğru olsa bile tek bir
      # `git add -f` ya da örneğe yapıştırılmış gerçek bir anahtar yeter; ve git geçmişi
      # silinmez — repo bir gün açılırsa geçmiş de açılır. Geçmiş taraması ~8 sn.
      - name: Sır taraması (çalışma ağacı + git geçmişi)
        run: |
          python -m scripts.sir_taramasi
          python -m scripts.sir_taramasi --gecmis

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate fresh DB
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
      - name: Start backend (AUTH on, rate-limit relaxed for e2e)
        env:
          DATABASE_URL: sqlite:///./data/ci.db
          SECRET_KEY: ci-test-secret-key-min-32-characters-long-0123456789
          AUTH_ENABLED: 'true'
          RATE_LIMIT_REGISTER_MAX: '1000'
          RATE_LIMIT_LOGIN_MAX: '1000'
        run: |
          python -m uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 && break; sleep 1; done
      - name: E2E (kullanım döngüsü + panel smoke)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
